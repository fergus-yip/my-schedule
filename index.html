        // MAIN SCHEDULE RENDERER (Runs instantly from local memory)
        window.renderSchedule = function() {
            const container = document.getElementById('schedule-content');
            container.innerHTML = '';

            const today = new Date();
            const todayTime = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
            const isCurrentYearView = currentViewYear === today.getFullYear();
            // Mon–Sun: end of this week (for fill + week logic)
            const currentWeekSunday = endOfWeekSunday(today);
            const currentWeekSundayEnd = new Date(
                currentWeekSunday.getFullYear(), currentWeekSunday.getMonth(), currentWeekSunday.getDate(), 23, 59, 59
            ).getTime();
            // This week + next 2 weeks (Sunday of the week that contains today+14)
            const weekHorizonSunday = endOfWeekSunday(
                new Date(today.getFullYear(), today.getMonth(), today.getDate() + 14)
            );
            const weekHorizonEnd = new Date(
                weekHorizonSunday.getFullYear(), weekHorizonSunday.getMonth(), weekHorizonSunday.getDate()
            ).getTime();

            const grouped = {};
            function ensureGroup(m, d) {
                if (!grouped[m]) grouped[m] = {};
                if (!grouped[m][d]) grouped[m][d] = { meTasks: [], yyTasks: [], events: [] };
            }

            window.events.forEach(ev => {
                let sYear = ev.year || today.getFullYear();
                let eYear = ev.endYear || sYear;
                let start = new Date(sYear, ev.startMonth, ev.startDate);
                let end = (ev.endMonth !== null && ev.endDate !== null) ? new Date(eYear, ev.endMonth, ev.endDate) : start;
                if (end < start) end = start; 

                if (start.getFullYear() > currentViewYear || end.getFullYear() < currentViewYear) return; 

                for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
                    if (dt.getFullYear() === currentViewYear) {
                        ensureGroup(dt.getMonth(), dt.getDate());
                        grouped[dt.getMonth()][dt.getDate()].events.push(ev);
                    }
                }
            });

            let displayTasks = window.tasks.filter(task => {
                const taskYear = task.year || today.getFullYear(); 
                if (taskYear !== currentViewYear) return false;
                const taskTime = new Date(taskYear, task.month, task.date).getTime();
                if (currentViewYear !== today.getFullYear()) return true; 
                return isShowingHistory ? taskTime < todayTime : taskTime >= todayTime;
            });

            displayTasks.forEach(task => {
                ensureGroup(task.month, task.date);
                if (task.owner === 'yy') { grouped[task.month][task.date].yyTasks.push(task); } 
                else { grouped[task.month][task.date].meTasks.push(task); }
            });

            // Fill empty days for remainder of current week only (today → Sunday)
            if (!isShowingHistory && isCurrentYearView) {
                for (let dt = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                     dt.getTime() <= currentWeekSundayEnd;
                     dt.setDate(dt.getDate() + 1)) {
                    if (dt.getFullYear() === currentViewYear) {
                        ensureGroup(dt.getMonth(), dt.getDate());
                    }
                }
            }

            for (let m = 0; m < 12; m++) {
                if (!grouped[m]) continue;
                
                let validDates = Object.keys(grouped[m]).sort((a, b) => parseInt(a) - parseInt(b));
                let viewableDates = validDates.filter(d => {
                    let dTime = new Date(currentViewYear, m, parseInt(d)).getTime();
                    if (currentViewYear !== today.getFullYear()) return true;
                    return isShowingHistory ? dTime < todayTime : dTime >= todayTime;
                });
                if (viewableDates.length === 0) continue;

                const monthDiv = document.createElement('div');
                monthDiv.className = isShowingHistory ? 'month-header collapsible' : 'month-header addable';
                monthDiv.innerHTML = `<span>${m + 1}月</span>`;
                if (isShowingHistory) {
                    monthDiv.onclick = function() { window.toggleMonthAcc(this); };
                } else {
                    monthDiv.title = 'Tap to add a task this month';
                    monthDiv.setAttribute('role', 'button');
                    monthDiv.onclick = () => window.openDayAddFromMonth(currentViewYear, m);
                }
                container.appendChild(monthDiv);

                const monthContentDiv = document.createElement('div');
                monthContentDiv.className = 'month-content';
                monthContentDiv.style.display = isShowingHistory ? 'none' : 'block';

                viewableDates.forEach((d, index) => {
                    const dateNum = parseInt(d);
                    const dateObj = new Date(currentViewYear, m, dateNum);
                    const dayName = daysOfWeek[dateObj.getDay()];

                    // Week spacers for this week + next 2 weeks (not tied to calendar month)
                    if (!isShowingHistory && isCurrentYearView && index > 0) {
                        const prevNum = parseInt(viewableDates[index - 1]);
                        const thisDayTime = new Date(currentViewYear, m, dateNum).getTime();
                        if (
                            thisDayTime <= weekHorizonEnd &&
                            weekStartKey(currentViewYear, m, dateNum) !== weekStartKey(currentViewYear, m, prevNum)
                        ) {
                            const weekSpacer = document.createElement('div');
                            weekSpacer.className = 'week-spacer';
                            monthContentDiv.appendChild(weekSpacer);
                        }
                    }

                    const isToday = (currentViewYear === today.getFullYear() && m === today.getMonth() && dateNum === today.getDate());
                    const isWeekend = dateObj.getDay() === 0 || dateObj.getDay() === 6;
                    const dayData = grouped[m][d];

                    let activeTrips = dayData.events.filter(ev => ev.endMonth !== null && ev.endDate !== null);
                    let startTrips = activeTrips.filter(ev => (ev.year || today.getFullYear()) === currentViewYear && ev.startMonth === m && ev.startDate === dateNum);
                    
                    startTrips.forEach(ev => {
                        const tripHeader = document.createElement('div');
                        tripHeader.className = 'trip-header';
                        tripHeader.style.color = ev.color;
                        tripHeader.textContent = `${ev.startDate}/${ev.startMonth + 1} - ${ev.endDate}/${ev.endMonth + 1} ${ev.name || ''}`;
                        tripHeader.onclick = () => window.openEventPopup(m, dateNum, ev.id);
                        monthContentDiv.appendChild(tripHeader);
                    });

                    const isEmptyDay = dayData.meTasks.length === 0 && dayData.yyTasks.length === 0 && dayData.events.length === 0;
                    const rowDiv = document.createElement('div');
                    rowDiv.className = isToday ? 'day-row today-row' : 'day-row';
                    if (isEmptyDay) rowDiv.classList.add('empty-day');
                    
                    if (activeTrips.length > 0 && !isToday) {
                        rowDiv.classList.add('trip-row');
                        rowDiv.style.borderLeft = `3px solid ${window.accentFill(activeTrips[0].color)}`;
                    } else if (activeTrips.length > 0 && isToday) {
                        rowDiv.style.borderLeft = `3px solid ${window.accentFill(activeTrips[0].color)}`;
                    }

                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'day-label' + (isWeekend ? ' weekend' : '');
                    labelDiv.innerHTML = `<span class="day-num">${dateNum}</span><span class="day-week">${dayName}</span>`;
                    window.bindDayLabelActions(labelDiv, currentViewYear, m, dateNum);
                    rowDiv.appendChild(labelDiv);

                    const tasksContainer = document.createElement('div');
                    tasksContainer.className = 'tasks-container';

                    const meRow = document.createElement('div');
                    meRow.className = 'day-tasks me-tasks';

                    let oneDayNotes = dayData.events.filter(ev => ev.endMonth === null || ev.endDate === null);
                    oneDayNotes.forEach(ev => {
                        const pill = document.createElement('span');
                        pill.className = 'event-pill solid';
                        pill.style.backgroundColor = window.accentFill(ev.color || 'var(--color-default)');
                        pill.style.color = '#fff';
                        pill.textContent = ev.name;
                        pill.onclick = (e) => { e.stopPropagation(); window.openEventPopup(m, dateNum, ev.id); };
                        meRow.appendChild(pill);
                    });

                    const buildTaskSpans = (taskArray, targetRow) => {
                        taskArray.sort((a, b) => a.customOrder - b.customOrder).forEach(task => {
                            const span = document.createElement('span');
                            span.className = task.isCancelled ? 'task-item cancelled' : 'task-item';
                            span.style.color = task.owner === 'yy' ? 'var(--color-purple)' : task.color;
                            span.setAttribute('data-id', task.id);
                            span.onclick = () => window.openTaskPopup(task.id); 
                            
                            let displayParts = [];
                            if (task.time) displayParts.push(window.formatTimeDisplay(task.time));
                            if (task.task) displayParts.push(task.task);
                            if (task.place) displayParts.push(`@${task.place}`);
                            
                            span.textContent = displayParts.join(' ');
                            targetRow.appendChild(span);
                        });
                    };

                    buildTaskSpans(dayData.meTasks, meRow);
                    tasksContainer.appendChild(meRow);

                    const yyRow = document.createElement('div');
                    yyRow.className = 'day-tasks yy-tasks';
                    buildTaskSpans(dayData.yyTasks, yyRow);
                    if (dayData.yyTasks.length > 0) { tasksContainer.appendChild(yyRow); }

                    rowDiv.appendChild(tasksContainer);
                    monthContentDiv.appendChild(rowDiv);
                });
                container.appendChild(monthContentDiv);
            }
            
            // Don't wipe skeleton days (current week fill) with empty message
            if (!container.querySelector('.day-row') && !container.querySelector('.trip-header')) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-dim); margin-top:40px;">No ${isShowingHistory ? 'history' : 'upcoming'} tasks.</p>`;
            }

            if (pendingScrollToToday) {
                pendingScrollToToday = false;
                setTimeout(() => window.scrollScheduleToToday(false), 0);
            }
        };
        
        // --------------------------------------------------------
        // UI shell (works without Firebase / network)
        // Anti-flicker uses !important — must setProperty with important.
        // --------------------------------------------------------
        window.cloudReady = false;

        window.showAppUI = function() {
            localStorage.setItem('isLoggedIn', 'true');
            const loading = document.getElementById('loading-screen');
            const login = document.getElementById('login-screen');
            const app = document.getElementById('app-content');
            if (loading) loading.style.setProperty('display', 'none', 'important');
            if (login) login.style.setProperty('display', 'none', 'important');
            if (app) app.style.setProperty('display', 'block', 'important');
            const err = document.getElementById('login-error');
            if (err) err.innerText = '';
        };

        window.showLoginUI = function() {
            localStorage.setItem('isLoggedIn', 'false');
            const loading = document.getElementById('loading-screen');
            const login = document.getElementById('login-screen');
            const app = document.getElementById('app-content');
            if (loading) loading.style.setProperty('display', 'none', 'important');
            if (login) login.style.setProperty('display', 'flex', 'important');
            if (app) app.style.setProperty('display', 'none', 'important');
        };

        // No-op until cloud engine loads (edits still queue locally)
        window.triggerCloudSync = function() {
            window.updateSyncStatus();
        };

        window.logoutApp = function() {
            document.getElementById('main-menu').style.display = 'none';
            if (typeof window._firebaseSignOut === 'function') {
                window._firebaseSignOut();
            } else {
                window.showLoginUI();
            }
        };

        document.getElementById('btn-login').addEventListener('click', () => {
            const err = document.getElementById('login-error');
            if (typeof window._firebaseLogin === 'function') {
                window._firebaseLogin();
            } else {
                err.innerText = navigator.onLine
                    ? 'Connecting to cloud… try again in a moment.'
                    : 'Network needed to sign in. You can use the app offline after signing in once.';
                // Retry cloud boot when user tries to log in
                if (window.bootCloudEngine) window.bootCloudEngine();
            }
        });

        // --------------------------------------------------------
        // INSTANT OFFLINE BOOT (NO WAITING FOR NETWORK / FIREBASE)
        // --------------------------------------------------------
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.showAppUI();
            window.updateArchiveYearsDropdown();
            pendingScrollToToday = true;
            window.renderSchedule();
            window.updateSyncStatus();
        }

    </script>


    <!-- ========================================== -->
    <!-- SCRIPT 3: FIREBASE — DEFERRED / OPTIONAL   -->
    <!-- Local schedule works even if this never loads -->
    <!-- ========================================== -->
    <script type="module">
        const FIREBASE_VERSION = '10.11.0';
        const firebaseConfig = {
            apiKey: "AIzaSyAn24IERKanVCykgyxHM58fTxe7UCkEh54",
            authDomain: "myspending-2ac16.firebaseapp.com",
            projectId: "myspending-2ac16",
            storageBucket: "myspending-2ac16.firebasestorage.app",
            messagingSenderId: "755799874759",
            appId: "1:755799874759:web:da6b57775ccfafd91e72e2"
        };

        let cloudBootPromise = null;
        let unsubTasksSnapshot = null;

        window.bootCloudEngine = function() {
            if (window.cloudReady) return cloudBootPromise;
            if (cloudBootPromise) return cloudBootPromise;

            cloudBootPromise = (async () => {
                try {
                    const [
                        { initializeApp },
                        { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut },
                        { initializeFirestore, persistentLocalCache, collection, doc, setDoc, deleteDoc, onSnapshot }
                    ] = await Promise.all([
                        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`),
                        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`),
                        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`)
                    ]);

                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const db = initializeFirestore(app, { localCache: persistentLocalCache() });

                    window.triggerCloudSync = async function() {
                        if (!navigator.onLine) return;
                        if (window.isSyncing) {
                            window.syncRequested = true;
                            return;
                        }
                        if (window.offlineQueue.length === 0) {
                            window.clearSyncRetry();
                            window.updateSyncStatus();
                            return;
                        }

                        window.isSyncing = true;
                        window.syncRequested = false;
                        window.updateSyncStatus();

                        window.offlineQueue = window.coalesceOfflineQueue(window.offlineQueue);
                        window.persistQueue();
                        window.updateSyncStatus();

                        let syncFailed = false;
                        try {
                            while (window.offlineQueue.length > 0) {
                                if (!navigator.onLine) {
                                    syncFailed = true;
                                    break;
                                }
                                const actionItem = window.offlineQueue[0];
                                if (actionItem.action === 'set') {
                                    await setDoc(doc(db, "tasks", actionItem.id), actionItem.data);
                                } else if (actionItem.action === 'delete') {
                                    await deleteDoc(doc(db, "tasks", actionItem.id));
                                }
                                window.offlineQueue.shift();
                                window.persistQueue();
                                window.updateSyncStatus();
                            }
                        } catch (error) {
                            syncFailed = true;
                            console.error("Network error during sync, will retry later.", error);
                        }

                        window.isSyncing = false;

                        if (window.offlineQueue.length === 0) {
                            window.clearSyncRetry();
                        } else if (syncFailed || navigator.onLine) {
                            const delay = window._syncRetryDelayMs;
                            window._syncRetryDelayMs = Math.min(delay * 2, 60000);
                            window.scheduleSyncRetry(delay);
                        }

                        window.updateSyncStatus();

                        if (window.syncRequested && window.offlineQueue.length > 0 && navigator.onLine) {
                            window.syncRequested = false;
                            window.triggerCloudSync();
                        }
                    };

                    window._firebaseLogin = function() {
                        const email = document.getElementById('login-email').value.trim();
                        const pass = document.getElementById('login-password').value;
                        document.getElementById('login-error').innerText = "Logging in...";
                        signInWithEmailAndPassword(auth, email, pass)
                            .then(() => {
                                window.showAppUI();
                                window.updateArchiveYearsDropdown();
                                window.renderSchedule();
                                window.updateSyncStatus();
                            })
                            .catch((error) => {
                                document.getElementById('login-error').innerText = "Error: " + error.message;
                            });
                    };

                    window._firebaseSignOut = function() {
                        signOut(auth).catch(() => {});
                        window.showLoginUI();
                    };

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            window.showAppUI();
                            window.updateArchiveYearsDropdown();
                            window.renderSchedule();
                            window.updateSyncStatus();

                            if (typeof unsubTasksSnapshot === 'function') {
                                unsubTasksSnapshot();
                                unsubTasksSnapshot = null;
                            }

                            unsubTasksSnapshot = onSnapshot(collection(db, "tasks"), (snapshot) => {
                                if (window.offlineQueue.length > 0) return;

                                let newTasks = [];
                                let newEvents = [];
                                snapshot.forEach(docSnap => {
                                    let data = docSnap.data();
                                    if (data.isEvent) { newEvents.push({ id: docSnap.id, ...data }); }
                                    else {
                                        if (data.customOrder === undefined) {
                                            let tNum = data.time ? window.timeSortNumber(data.time) : NaN;
                                            data.customOrder = !isNaN(tNum) ? (tNum * 10000) : (24000000 + ((data.sortOrder || 0) % 10000));
                                        }
                                        newTasks.push({ id: docSnap.id, ...data });
                                    }
                                });

                                const remoteEmpty = newTasks.length === 0 && newEvents.length === 0;
                                const localHasData = window.tasks.length > 0 || window.events.length > 0;

                                if (remoteEmpty && localHasData) {
                                    console.warn('Ignoring empty remote snapshot while local data exists.');
                                    return;
                                }

                                window.tasks = newTasks;
                                window.events = newEvents;
                                localStorage.setItem('my_tasks', JSON.stringify(window.tasks));
                                localStorage.setItem('my_events', JSON.stringify(window.events));

                                window.updateArchiveYearsDropdown();
                                window.renderSchedule();
                                window.updateSyncStatus();
                            });

                            window.triggerCloudSync();
                        } else {
                            if (typeof unsubTasksSnapshot === 'function') {
                                unsubTasksSnapshot();
                                unsubTasksSnapshot = null;
                            }
                            // Only force login UI if we are not mid offline-session with local flag.
                            // Firebase says logged out → show login (token expired / real logout).
                            if (localStorage.getItem('isLoggedIn') === 'true' && !navigator.onLine) {
                                // Stay on local schedule offline even if auth can't refresh
                                console.warn('Auth unavailable offline; keeping local session.');
                                return;
                            }
                            window.showLoginUI();
                        }
                    });

                    window.cloudReady = true;
                    window.updateSyncStatus();
                    return true;
                } catch (err) {
                    console.warn('Cloud engine unavailable (offline or weak network). Local schedule still works.', err);
                    cloudBootPromise = null;
                    window.cloudReady = false;
                    window.updateSyncStatus();
                    return false;
                }
            })();

            return cloudBootPromise;
        };

        // Defer cloud until after local paint; retry when back online
        const startCloud = () => { window.bootCloudEngine(); };
        if (document.readyState === 'complete') {
            setTimeout(startCloud, 0);
        } else {
            window.addEventListener('load', () => setTimeout(startCloud, 0));
        }
        window.addEventListener('online', () => {
            window.bootCloudEngine().then((ok) => {
                if (ok && window.triggerCloudSync) window.triggerCloudSync();
            });
        });
    </script>
