<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- TRUE PWA TAGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Schedule">
    <meta name="theme-color" content="#0c0c0e">
    
    <!-- Link to our external files -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <title>My Schedule</title>

    <!-- Instant paint: never pure white while shell/network stalls -->
    <style>html,body{background:#0c0c0e;margin:0;}</style>
    
    <!-- ZERO-LATENCY ANTI-FLICKER SCRIPT -->
    <script>
        if (localStorage.getItem('isLoggedIn') === 'true') {
            document.write('<style>#loading-screen { display: none !important; } #login-screen { display: none !important; } #app-content { display: block !important; }</style>');
        } else {
            document.write('<style>#loading-screen { display: none !important; } #login-screen { display: flex !important; }</style>');
        }
    </script>

    <style>
        :root {
            /* Surfaces */
            --bg-page: #0c0c0e;
            --bg-elevated: #16161a;
            --bg-sheet: #1c1c22;
            --bg-input: #121216;
            --bg-muted: #25252d;
            --bg-hover: #2e2e38;

            /* Borders */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);

            /* Text */
            --text-main: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-dim: #71717a;
            --text-inverse: #ffffff;

            /* UI chrome (buttons, FAB, selected ring) — keep solid & vivid */
            --brand: #3b82f6;
            --accent-success: #4ade80;
            --accent-warning: #fb923c;

            /* Task / label TEXT on dark bg — vivid & readable */
            --color-default: #f4f4f5;
            --color-purple: #c084fc;
            --color-orange: #fb923c;
            --color-green: #4ade80;
            --color-blue: #60a5fa;
            --color-red: #f87171;
            --color-pink: #f472b6;
            --color-weekend: #fb7185;       /* calendar headers/cells */
            --color-weekend-list: #9a7a80;  /* schedule list — paler, less shouty */

            /* Note/trip PILL fills — dark enough for white text */
            --color-default-fill: #3f3f46;
            --color-purple-fill: #7e22ce;
            --color-orange-fill: #c2410c;
            --color-green-fill: #047857;
            --color-blue-fill: #1d4ed8;
            --color-red-fill: #b91c1c;
            --color-pink-fill: #be185d;

            /* Compat aliases used in existing JS/CSS */
            --bg-color: var(--bg-elevated);
            --container-bg: var(--bg-page);
            --month-bg: transparent;

            /* Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-pill: 999px;

            /* Space */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;

            /* Type */
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --text-caption: 12px;
            --text-sm: 14px;
            --text-body: 16px;
            --text-title: 17px;
            --text-headline: 20px;

            /* Elevation */
            --shadow-sheet: 0 -8px 40px rgba(0, 0, 0, 0.45);
            --shadow-float: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-fab: 0 8px 24px rgba(59, 130, 246, 0.35);

            /* Fallback if an old/unknown accent has no -fill token */
            --color-unknown-fill: #3f3f46;

            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * { box-sizing: border-box; }
        html { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font);
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: calc(96px + var(--safe-bottom));
            font-size: var(--text-body);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* Loading */
        #loading-screen {
            position: fixed; inset: 0;
            background: var(--bg-page);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; color: var(--text-secondary);
        }
        .loader {
            width: 28px; height: 28px;
            border: 2.5px solid var(--border-strong);
            border-top-color: var(--accent-success);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: var(--space-3);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Login */
        #login-screen {
            position: fixed; inset: 0;
            background: var(--bg-page);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            padding: var(--space-4);
            padding-top: calc(var(--space-4) + var(--safe-top));
            padding-bottom: calc(var(--space-4) + var(--safe-bottom));
        }
        .login-box {
            background: var(--bg-elevated);
            padding: var(--space-5) var(--space-4);
            border-radius: var(--radius-xl);
            text-align: center;
            width: 100%; max-width: 360px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-float);
        }
        .login-brand {
            width: 56px; height: 56px; border-radius: 14px;
            background: linear-gradient(145deg, var(--brand), #1d4ed8);
            color: #fff; font-weight: 700; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto var(--space-3);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .login-box h2 {
            margin: 0 0 4px; font-size: var(--text-headline); font-weight: 650; letter-spacing: -0.02em;
        }
        .login-subtitle {
            margin: 0 0 var(--space-4); font-size: var(--text-sm); color: var(--text-secondary); font-weight: 400;
        }
        .login-box input {
            width: 100%; padding: 14px var(--space-3); margin: 0 0 var(--space-2);
            background: var(--bg-input); border: 1px solid var(--border-strong);
            color: var(--text-main); border-radius: var(--radius-md);
            font-size: var(--text-body); font-family: inherit;
        }
        .login-box input:focus {
            outline: none; border-color: rgba(59, 130, 246, 0.7);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .login-box button {
            width: 100%; padding: 14px; margin-top: var(--space-2);
            background: var(--brand); color: #fff; border: none;
            border-radius: var(--radius-md); cursor: pointer;
            font-weight: 600; font-size: var(--text-body); font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }
        .login-box button:active { opacity: 0.9; transform: scale(0.99); }
        #login-error {
            color: #fca5a5; font-size: var(--text-sm); margin: var(--space-3) 0 0;
            min-height: 1.2em;
        }

        /* Top bar */
        .top-bar {
            padding: 12px var(--space-4);
            padding-top: calc(12px + var(--safe-top));
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky; top: 0; z-index: 1000;
            background: rgba(12, 12, 14, 0.78);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
        }
        .title-wrapper { position: relative; display: flex; align-items: center; min-height: 44px; }
        .top-title-select {
            background: transparent; border: none; color: var(--text-main);
            font-weight: 650; font-size: var(--text-title); letter-spacing: -0.02em;
            appearance: none; -webkit-appearance: none; outline: none;
            padding: 8px 4px 8px 0; margin: 0; cursor: pointer; font-family: inherit;
        }
        .title-wrapper::after {
            content: '';
            width: 0; height: 0; margin-left: 6px;
            border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-top: 5px solid var(--text-dim);
            pointer-events: none;
        }
        .top-actions { display: flex; align-items: center; gap: 10px; }
        .status-wrapper {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 10px; border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            max-width: 42vw;
        }
        .status-dot {
            height: 7px; width: 7px; flex-shrink: 0;
            background-color: var(--accent-success); border-radius: 50%;
            transition: background-color 0.25s;
        }
        #sync-text {
            font-size: var(--text-caption); color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .menu-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; padding: 10px; min-width: 44px; min-height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-sm);
        }
        .menu-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }

        .dropdown-menu {
            display: none; position: absolute;
            right: var(--space-3); top: calc(100% - 4px);
            background: var(--bg-sheet);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-float);
            z-index: 1002; overflow: hidden; min-width: 200px;
        }
        .dropdown-item {
            padding: 13px var(--space-4); color: var(--text-main); cursor: pointer;
            border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: var(--bg-hover); }

        /* Schedule */
        #schedule-container {
            max-width: 800px; margin: 0 auto;
            padding: var(--space-3) var(--space-4) var(--space-5);
        }
        .view-title {
            font-size: var(--text-caption); color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: var(--space-3); display: none; font-weight: 600;
        }

        /* Month header — soft section band (clear section break) */
        .month-header {
            background: var(--bg-muted);
            padding: 9px 14px;
            margin-top: var(--space-5);
            margin-bottom: var(--space-3);
            font-weight: 650;
            font-size: 15px;
            letter-spacing: 0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
        }
        .month-header:first-of-type { margin-top: var(--space-2); }
        .month-header.collapsible { cursor: pointer; user-select: none; }
        .month-header.addable { cursor: pointer; user-select: none; }
        .month-header.collapsible:hover,
        .month-header.addable:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }

        .trip-header {
            font-size: var(--text-sm); font-weight: 600;
            margin-top: var(--space-3); margin-bottom: var(--space-2);
            cursor: pointer; opacity: 0.92;
        }
        .trip-header:hover { opacity: 1; }

        .day-row {
            display: flex; margin-bottom: 8px; align-items: flex-start;
            line-height: 1.4; border-radius: var(--radius-sm);
            transition: background 0.15s;
            border-left: 3px solid transparent;
            padding: 2px 0 2px 8px; margin-left: -11px;
        }
        .day-label {
            display: flex; width: 56px; flex-shrink: 0; font-weight: 600;
            color: var(--text-main); cursor: pointer;
            border-radius: var(--radius-sm); padding: 2px 2px;
            min-height: 28px; align-items: center;
        }
        .day-label:hover { background-color: rgba(255,255,255,0.06); }
        .day-num { width: 22px; text-align: left; pointer-events: none; font-variant-numeric: tabular-nums; }
        .day-week { width: auto; pointer-events: none; color: var(--text-secondary); font-weight: 500; font-size: var(--text-sm); }
        .day-label.weekend .day-num,
        .day-label.weekend .day-week { color: var(--color-weekend-list); font-weight: 500; }

        .day-row.today-row {
            background: rgba(74, 222, 128, 0.07);
            border-left-color: var(--accent-success);
            padding-top: 6px; padding-bottom: 6px;
            margin-top: 2px; margin-bottom: 10px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        .today-row .day-label,
        .today-row .day-label.weekend .day-num,
        .today-row .day-label.weekend .day-week { color: var(--accent-success); }
        .today-row .day-week { color: var(--accent-success); opacity: 0.9; }

        .btn-today {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.35);
            color: var(--accent-success);
            font-size: var(--text-caption);
            font-weight: 650;
            font-family: inherit;
            padding: 6px 10px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            min-height: 32px;
            white-space: nowrap;
        }
        .btn-today:active { opacity: 0.85; }

        .app-toast {
            position: fixed;
            left: 50%;
            bottom: calc(88px + var(--safe-bottom));
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-sheet);
            color: var(--text-main);
            border: 1px solid var(--border-strong);
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            font-size: var(--text-sm);
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            box-shadow: var(--shadow-float);
            transition: opacity 0.18s, transform 0.18s;
        }
        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .day-row.trip-row { border-left-color: var(--color-orange-fill); }
        .day-row.empty-day .day-label { color: var(--text-dim); }
        .day-row.empty-day .day-week { color: var(--text-dim); }
        .day-row.empty-day .tasks-container { opacity: 0.55; }
        .week-spacer {
            height: 1px;
            margin: 18px 0 16px;
            background: rgba(255, 255, 255, 0.22);
            border: none;
        }

        .tasks-container { flex-grow: 1; display: flex; flex-direction: column; min-height: 20px; gap: 2px; }
        .day-tasks { display: block; }
        .day-tasks:empty { display: none; }

        .task-item {
            cursor: pointer; border-radius: 6px; display: inline-block;
            padding: 1px 6px; margin-left: -4px; position: relative;
            transition: background-color 0.15s; font-size: var(--text-body);
        }
        .task-item:hover { background-color: rgba(255, 255, 255, 0.08); }
        .task-item.cancelled { text-decoration: line-through; opacity: 0.62; }
        .task-item::after { content: ' · '; color: var(--text-dim); margin: 0 1px; font-weight: 300; pointer-events: none; }
        .task-item:last-child::after { content: ''; }

        .event-pill {
            display: inline-block; padding: 2px 9px; border-radius: var(--radius-pill);
            font-size: var(--text-sm); font-weight: 600; margin-right: 6px; margin-bottom: 2px;
            cursor: pointer; vertical-align: middle; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4); user-select: none;
            border: none;
        }
        .event-pill:hover { filter: brightness(1.08); }
        .month-content { display: none; }

        /* FAB */
        .fab-btn {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom)); right: 20px;
            width: 56px; height: 56px;
            background: var(--brand); color: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: 300;
            box-shadow: var(--shadow-fab);
            cursor: pointer; z-index: 999; transition: transform 0.12s, box-shadow 0.15s;
            line-height: 1; padding-bottom: 2px; box-sizing: border-box;
            border: none;
        }
        .fab-btn:active { transform: scale(0.94); }

        /* Backdrop + sheets */
        .modal-backdrop {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 1001;
        }
        .popup-modal {
            display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            background: var(--bg-sheet);
            border-top: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: 10px var(--space-4) calc(22px + var(--safe-bottom));
            z-index: 1002; width: 100%; max-width: 600px; max-height: 88vh;
            overflow-y: auto; box-shadow: var(--shadow-sheet);
        }
        .popup-modal::before {
            content: '';
            display: block; width: 36px; height: 4px;
            background: var(--border-strong);
            border-radius: var(--radius-pill);
            margin: 2px auto 12px;
        }
        @media (min-width: 900px) {
            .popup-modal {
                bottom: calc(24px + var(--safe-bottom)); right: 24px; left: auto; transform: none;
                width: 400px; border-radius: var(--radius-lg);
                border: 1px solid var(--border-strong);
                padding: var(--space-4);
                box-shadow: var(--shadow-float);
            }
            .popup-modal::before { display: none; }
        }

        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: var(--space-3); font-weight: 650; font-size: var(--text-title);
            letter-spacing: -0.02em;
        }
        .cal-nav-btn {
            background: var(--bg-muted); color: var(--text-main); border: 1px solid var(--border-subtle);
            padding: 8px 14px; min-height: 40px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: var(--text-sm); font-family: inherit;
        }
        .cal-nav-btn:hover { background: var(--bg-hover); }
        #cal-month-display {
            cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm);
            transition: background 0.15s; font-weight: 650;
        }
        #cal-month-display:hover { background: var(--bg-muted); }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-cell {
            padding: 11px 4px; border-radius: var(--radius-sm); cursor: pointer;
            background: var(--bg-muted); font-size: var(--text-body);
            transition: background 0.15s, box-shadow 0.15s; color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }
        .cal-cell:hover { background: var(--bg-hover); }
        .cal-cell.weekend { color: var(--color-weekend); }
        .cal-cell.today { background: var(--accent-success); color: #0c0c0e; font-weight: 700; }
        .cal-cell.today:hover { filter: brightness(1.05); }
        .cal-cell.selected {
            box-shadow: inset 0 0 0 2px var(--brand);
            background: rgba(59, 130, 246, 0.28); font-weight: 650;
        }
        .cal-cell.selected:hover { background: rgba(59, 130, 246, 0.38); }
        .cal-cell.today.selected {
            background: var(--accent-success); color: #0c0c0e;
            box-shadow: inset 0 0 0 2px var(--brand);
        }
        .cal-cell.today.weekend { color: #0c0c0e; }
        .cal-cell.selected.weekend { color: #fff; }
        .cal-cell.selected:not(.today).weekend { color: #fecaca; }

        .cal-day-name {
            font-weight: 600; color: var(--text-dim); font-size: var(--text-caption);
            padding-bottom: 4px; letter-spacing: 0.02em;
        }
        .cal-day-name.weekend { color: var(--color-weekend); }
        .cal-month-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .cal-month-cell {
            padding: 16px 5px; background: var(--bg-muted); border-radius: var(--radius-md);
            cursor: pointer; font-size: var(--text-body); font-weight: 600;
        }
        .cal-month-cell:hover { background: var(--bg-hover); }

        .event-input-group, .task-input-group {
            display: flex; gap: 8px; margin-bottom: 10px; align-items: center;
        }
        .event-label, .task-label {
            width: 50px; color: var(--text-secondary); font-size: var(--text-sm); font-weight: 600;
        }

        select, input[type="text"], input[type="tel"], input[type="email"], input[type="password"], input[type="search"], textarea {
            padding: 11px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            border-radius: var(--radius-md);
            font-size: var(--text-body);
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        select:focus, input[type="text"]:focus, input[type="tel"]:focus,
        input[type="email"]:focus, input[type="password"]:focus,
        input[type="search"]:focus, textarea:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.65);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
        }

        .colors {
            display: flex; gap: 14px; align-items: center; justify-content: center;
            margin-top: var(--space-3); margin-bottom: var(--space-2);
        }
        .color-dot {
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.1s, box-shadow 0.15s;
        }
        .color-dot:active { transform: scale(0.92); }
        .color-dot.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
        }

        .action-group { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
        .btn-action {
            padding: 12px 8px; border: none; border-radius: var(--radius-md);
            cursor: pointer; font-weight: 600; font-size: var(--text-sm);
            text-align: center; transition: opacity 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-action:active { opacity: 0.88; transform: scale(0.99); }
        .primary-btn { background: var(--brand); color: #fff; }
        .secondary-btn { background: var(--bg-muted); color: var(--text-main); border: 1px solid var(--border-strong); }
        .danger-btn { background: #dc2626; color: #fff; }
        .neutral-btn { background: var(--bg-muted); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

        .owner-switch {
            display: flex; background: var(--bg-input); border-radius: var(--radius-md);
            overflow: hidden; border: 1px solid var(--border-strong);
            width: 100%; margin-bottom: 10px; padding: 3px; gap: 3px;
        }
        .owner-option {
            flex: 1; text-align: center; padding: 9px 8px; font-size: var(--text-sm);
            font-weight: 600; color: var(--text-dim); cursor: pointer;
            border-radius: calc(var(--radius-md) - 2px); transition: 0.15s;
        }
        .owner-option.active { background: var(--bg-muted); color: var(--text-main); }
        .owner-option.yy.active { background: rgba(192, 132, 252, 0.25); color: var(--color-purple); }

        #day-add-tabs.day-add-switch {
            display: inline-flex; flex: 0 0 auto; width: auto; margin: 0;
            background: var(--bg-input); border: 1px solid var(--border-strong);
            border-radius: var(--radius-pill); overflow: hidden; padding: 2px;
        }
        #day-add-tabs .day-add-switch-opt {
            flex: none; padding: 5px 11px; font-size: var(--text-caption); font-weight: 600;
            color: var(--text-dim); cursor: pointer; border-radius: var(--radius-pill);
            line-height: 1.2; user-select: none; white-space: nowrap;
        }
        #day-add-tabs .day-add-switch-opt.active {
            background: var(--brand); color: #fff;
        }
        .day-add-header-right { display: flex; align-items: center; gap: 6px; }
        #panel-add-note { display: none; }
        #day-add-popup.mode-note #panel-add-task { display: none; }
        #day-add-popup.mode-note #panel-add-note { display: block; }
        #day-add-popup.mode-task #panel-add-task { display: block; }
        #day-add-popup.mode-task #panel-add-note { display: none; }
        #day-add-popup.hide-tabs #day-add-tabs { display: none; }

        .mode-toggle {
            background: none; border: none; color: var(--text-secondary);
            font-size: var(--text-caption); cursor: pointer;
            text-align: right; width: 100%; margin-bottom: 8px;
            font-family: inherit; font-weight: 500; padding: 4px 0;
        }
        .mode-toggle:hover { color: var(--brand); }

        #visual-inputs { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        #quick-inputs { display: none; width: 100%; box-sizing: border-box; }
        #quick-textarea {
            width: 100%; height: 120px; resize: none; overflow-y: auto;
            display: block; box-sizing: border-box;
        }
        /* Align with textarea text: same horizontal padding as inputs (11px 12px) */
        .quick-format-hint {
            margin: 0 0 6px;
            padding: 0 12px;
            box-sizing: border-box;
            width: 100%;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: var(--text-caption);
            font-weight: 650;
            letter-spacing: 0.03em;
            color: var(--brand);
        }
        #quick-batch-errors {
            display: none; margin-top: 8px; padding: 10px 12px;
            border-radius: var(--radius-md);
            background: rgba(220, 38, 38, 0.12); border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5; font-size: var(--text-sm); line-height: 1.45;
            max-height: 100px; overflow-y: auto; white-space: pre-wrap;
        }
        #quick-batch-errors.visible { display: block; }

        #btn-toggle-cal {
            background: var(--bg-input); border: 1px solid var(--border-strong);
            padding: 10px 12px; font-size: 16px; border-radius: var(--radius-md);
            cursor: pointer; color: var(--text-main);
        }
        #btn-toggle-cal:hover { background: var(--bg-muted); }

        #search-popup .search-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        #search-query { flex: 1; width: 100%; }
        #search-results { max-height: 50vh; overflow-y: auto; }
        .search-result-item {
            padding: 12px 10px; border-bottom: 1px solid var(--border-subtle);
            cursor: pointer; font-size: var(--text-sm); line-height: 1.4;

        .search-result-item.cancelled .search-result-body { text-decoration: line-through; opacity: 0.65; }
        .search-empty {

            padding: var(--space-5) var(--space-3); font-size: var(--text-sm);

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <!-- ========================================== -->
    <!-- SCRIPT 2: INSTANT LOCAL ENGINE             -->
    <!-- ========================================== -->
    <script>
        const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
        // Calendar header: Monday-first week
        const calDaysMonFirst = ['一', '二', '三', '四', '五', '六', '日'];

        // Mon=0 … Sun=6
        function mondayIndex(date) {
            return (date.getDay() + 6) % 7;
        }
        function startOfWeekMonday(date) {
            const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            d.setDate(d.getDate() - mondayIndex(d));
            return d;
        }
        function endOfWeekSunday(date) {
            const mon = startOfWeekMonday(date);
            return new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
        }
        function weekStartKey(year, month, day) {
            return startOfWeekMonday(new Date(year, month, day)).getTime();
        }

        // Map text accent tokens → darker pill fills (white text on fill)
        // Stored data stays e.g. var(--color-orange); fills resolve at render.
        window.accentFill = function(token) {
            if (!token) return 'var(--color-default-fill)';
            const m = String(token).match(/var\(\s*(--color-[\w-]+)\s*\)/);
            if (m) {
                if (m[1].endsWith('-fill')) return token;
                return `var(${m[1]}-fill)`;
            }
            return token;
        };

        window.safeJsonParse = function(raw, fallback) {
            try {
                if (raw === null || raw === undefined || raw === '') return fallback;
                const parsed = JSON.parse(raw);
                return parsed === null ? fallback : parsed;
            } catch (e) {
                console.warn('Corrupt localStorage JSON, using fallback.', e);
                return fallback;
            }
        };

        window.persistQueue = function() {
            localStorage.setItem('my_queue', JSON.stringify(window.offlineQueue));
        };

        // Keep only the final op per id (last set or delete wins)
        window.coalesceOfflineQueue = function(queue) {
            const byId = new Map();
            queue.forEach((item, index) => {
                byId.set(item.id, { item, index });
            });
            return Array.from(byId.values())
                .sort((a, b) => a.index - b.index)
                .map(entry => entry.item);
        };
        
        // INSTANT MEMORY ACCESS
        window.tasks = window.safeJsonParse(localStorage.getItem('my_tasks'), []);
        window.events = window.safeJsonParse(localStorage.getItem('my_events'), []);
        window.offlineQueue = window.safeJsonParse(localStorage.getItem('my_queue'), []);
        if (!Array.isArray(window.tasks)) window.tasks = [];
        if (!Array.isArray(window.events)) window.events = [];
        if (!Array.isArray(window.offlineQueue)) window.offlineQueue = [];
        
        let editingId = null;
        let editingEventId = null;
        
        let currentOwner = 'me'; 
        let selectedColor = 'var(--color-default)';
        let selectedEventColor = 'var(--color-orange)';
        let isShowingHistory = false;
        let isQuickMode = false;
        let pendingScrollToToday = false;

        let currentViewYear = new Date().getFullYear();
        let lastUsedYear = null;
        let lastUsedMonth = null;
        let lastUsedDate = null;
        let lastUsedOwner = 'me';

        // Persist owner (and last date fields for reference)
        (function loadPrefs() {
            const p = window.safeJsonParse(localStorage.getItem('my_prefs'), {});
            if (p && typeof p === 'object') {
                if (p.lastUsedOwner === 'me' || p.lastUsedOwner === 'yy') lastUsedOwner = p.lastUsedOwner;
                if (p.lastUsedYear != null) lastUsedYear = p.lastUsedYear;
                if (p.lastUsedMonth != null) lastUsedMonth = p.lastUsedMonth;
                if (p.lastUsedDate != null) lastUsedDate = p.lastUsedDate;
            }
            currentOwner = lastUsedOwner;
        })();

        window.savePrefs = function() {
            localStorage.setItem('my_prefs', JSON.stringify({
                lastUsedOwner: lastUsedOwner,
                lastUsedYear: lastUsedYear,
                lastUsedMonth: lastUsedMonth,
                lastUsedDate: lastUsedDate
            }));
        };

        window.showToast = function(message) {
            const t = document.getElementById('app-toast');
            if (!t) return;
            t.textContent = message;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
        };

        window.scrollScheduleToToday = function(smooth) {
            const el = document.querySelector('.day-row.today-row');
            if (!el) return false;
            const topBar = document.querySelector('.top-bar');
            const offset = (topBar ? topBar.offsetHeight : 56) + 10;
            const y = el.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
            return true;
        };

        window.jumpToToday = function() {
            document.getElementById('main-menu').style.display = 'none';
            const today = new Date();
            window.setHistoryView(false);
            currentViewYear = today.getFullYear();
            window.updateArchiveYearsDropdown();
            const sel = document.getElementById('view-year-select');
            if (sel) sel.value = String(currentViewYear);
            pendingScrollToToday = true;
            window.renderSchedule();
            setTimeout(() => window.scrollScheduleToToday(true), 40);
        };

        // Live Sync Monitor Logic
        window.isSyncing = false;
        window.syncRequested = false;
        window._syncRetryTimer = null;
        window._syncRetryDelayMs = 5000;
        
        window.updateSyncStatus = function() {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            if (!dot || !text) return;

            const pending = window.offlineQueue.length;

            if (!navigator.onLine) {
                dot.style.backgroundColor = 'var(--color-red)';
                text.innerText = pending > 0 ? `Offline · ${pending}` : 'Offline';
                text.style.color = 'var(--color-red)';
            } else if (window.isSyncing) {
                dot.style.backgroundColor = 'var(--accent-warning)';
                text.innerText = pending > 0 ? `Saving · ${pending}` : 'Saving…';
                text.style.color = 'var(--accent-warning)';
            } else if (pending > 0) {
                dot.style.backgroundColor = 'var(--accent-warning)';
                text.innerText = `Pending · ${pending}`;
                text.style.color = 'var(--accent-warning)';
            } else {
                dot.style.backgroundColor = 'var(--accent-success)';
                text.innerText = 'Synced';
                text.style.color = 'var(--text-secondary)';
            }
        };

        window.scheduleSyncRetry = function(delayMs) {
            if (window._syncRetryTimer) clearTimeout(window._syncRetryTimer);
            const wait = delayMs != null ? delayMs : window._syncRetryDelayMs;
            window._syncRetryTimer = setTimeout(() => {
                window._syncRetryTimer = null;
                if (window.triggerCloudSync) window.triggerCloudSync();
            }, wait);
        };

        window.clearSyncRetry = function() {
            if (window._syncRetryTimer) {
                clearTimeout(window._syncRetryTimer);
                window._syncRetryTimer = null;
            }
            window._syncRetryDelayMs = 5000;
        };

        // --- EXPORT AND IMPORT LOGIC ---
        window.exportData = function() {
            document.getElementById('main-menu').style.display = 'none'; 
            
            // Bundle your arrays into one object
            const backupData = {
                tasks: window.tasks,
                events: window.events
            };
            
            // Convert to a downloadable JSON string
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
            
            // Create a temporary link to trigger the download
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "myschedule_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();

        window.importData = function(event) {
            document.getElementById('main-menu').style.display = 'none'; 
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backup = JSON.parse(e.target.result);
                    if (!backup.tasks || !backup.events) throw new Error("Invalid format");

                    if (!confirm("Import this backup? This will safely add any missing items to your current schedule without deleting existing ones.")) return;

                    // Track existing IDs so we don't create duplicates
                    const existingTaskIds = new Set(window.tasks.map(t => t.id));
                    const existingEventIds = new Set(window.events.map(ev => ev.id));
                    let importedCount = 0;

                    // Merge Tasks
                    backup.tasks.forEach(task => {
                        if (!existingTaskIds.has(task.id)) {
                            window.tasks.push(task);
                            window.offlineQueue.push({ action: 'set', id: task.id, data: task });
                            importedCount++;
                        }
                    });

                    // Merge Events
                    backup.events.forEach(ev => {
                        if (!existingEventIds.has(ev.id)) {
                            window.events.push(ev);
                            window.offlineQueue.push({ action: 'set', id: ev.id, data: ev });
                            importedCount++;
                        }
                    });

                    // Save back to Local Storage
                    localStorage.setItem('my_tasks', JSON.stringify(window.tasks));
                    localStorage.setItem('my_events', JSON.stringify(window.events));
                    localStorage.setItem('my_queue', JSON.stringify(window.offlineQueue));

                    // Refresh UI and trigger Cloud Sync
                    window.updateArchiveYearsDropdown();
                    window.renderSchedule();
                    window.updateSyncStatus();
                    if (window.triggerCloudSync) window.triggerCloudSync();

                    alert(`Import successful! Added ${importedCount} new items.`);
                } catch (error) {
                    alert("Error reading backup. Please make sure it is a valid JSON file generated by this app.");
                    console.error(error);
                }
                
                // Reset the file input so the exact same file can be selected again if needed
                event.target.value = '';
            };
            
            reader.readAsText(file);
        };

        // --- OFFLINE TASK QUEUING ENGINE ---
        function generateUniqueId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 5);
        }

        // Batch: DATE, TIME, TASK, PLACE — date is field 1 only
        window.parseBatchDateToken = function(token, formYear, formMonth) {
            const raw = (token || '').trim();
            if (!raw) {
                return { error: 'first field must be a date (YYYYMMDD / YYMMDD / MMDD / DD)' };
            }
            if (!/^\d+$/.test(raw)) {
                return { error: `first field must be digits only (date), got "${raw}"` };
            }

            let year, month, day;
            if (raw.length === 8) {
                year = parseInt(raw.slice(0, 4), 10);
                month = parseInt(raw.slice(4, 6), 10) - 1;
                day = parseInt(raw.slice(6, 8), 10);
            } else if (raw.length === 6) {
                year = 2000 + parseInt(raw.slice(0, 2), 10);
                month = parseInt(raw.slice(2, 4), 10) - 1;
                day = parseInt(raw.slice(4, 6), 10);
            } else if (raw.length === 4) {
                year = formYear;
                month = parseInt(raw.slice(0, 2), 10) - 1;
                day = parseInt(raw.slice(2, 4), 10);
            } else if (raw.length === 1 || raw.length === 2) {
                year = formYear;
                month = formMonth;
                day = parseInt(raw, 10);
            } else {
                return { error: `first field must be YYYYMMDD / YYMMDD / MMDD / DD (got ${raw.length} digits)` };
            }

            if (month < 0 || month > 11) {
                return { error: `invalid month in date "${raw}"` };
            }
            if (!Number.isFinite(day) || day < 1) {
                return { error: `invalid day in date "${raw}"` };
            }
            const dim = new Date(year, month + 1, 0).getDate();
            if (day > dim) {
                return { error: `day ${day} not valid for ${month + 1}/${year}` };
            }
            return { year, month, day };
        };

        function parseClockToken(token) {
            const raw = String(token || '').trim();
            if (!raw) return null;
            if (/^\d{1,4}$/.test(raw)) return raw;
            const colon = raw.match(/^(\d{1,2})[:.：](\d{2})$/);
            if (colon) return colon[1] + colon[2];
            return null;
        }

        function formatClockDisplay(compact) {
            const digits = String(compact || '');
            let hh, mm;
            if (digits.length <= 2) {
                hh = parseInt(digits, 10);
                mm = 0;
            } else if (digits.length === 3) {
                hh = parseInt(digits.slice(0, 1), 10);
                mm = parseInt(digits.slice(1), 10);
            } else {
                hh = parseInt(digits.slice(0, 2), 10);
                mm = parseInt(digits.slice(2), 10);
            }
            if (!Number.isFinite(hh) || !Number.isFinite(mm)) return digits;
            return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
        }

        function splitTimeRange(raw) {
            const s = String(raw || '').trim();
            if (!s) return null;
            const parts = s.split(/\s*[-–—－~～]\s*/);
            if (parts.length !== 2 || !parts[0] || !parts[1]) return null;
            return parts;
        }

        window.formatTimeDisplay = function(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            const range = splitTimeRange(raw);
            if (range) {
                const a = parseClockToken(range[0]);
                const b = parseClockToken(range[1]);
                if (a && b) return formatClockDisplay(a) + '-' + formatClockDisplay(b);
            }
            const single = parseClockToken(raw);
            if (single) return formatClockDisplay(single);
            return raw;
        };

        window.timeSortNumber = function(value) {
            const raw = String(value || '').trim();
            if (!raw) return NaN;
            const range = splitTimeRange(raw);
            const start = range ? range[0] : raw;
            const compact = parseClockToken(start);
            if (!compact) return parseInt(raw.replace(/[^0-9]/g, ''), 10);
            return parseInt(formatClockDisplay(compact).replace(':', ''), 10);
        };

        window.parseBatchTimeField = function(token) {
            const raw = (token || '').trim();
            if (!raw) return { time: '' };
            const range = splitTimeRange(raw);
            if (range) {
                const a = parseClockToken(range[0]);
                const b = parseClockToken(range[1]);
                if (a && b) return { time: a + '-' + b };
                return { error: `invalid time range "${raw}" (use e.g. 1300-1500)` };
            }
            const single = parseClockToken(raw);
            if (single) return { time: single };
            return { error: `invalid time "${raw}" (use e.g. 1300 or 1300-1500)` };
        };

        window.clearBatchErrors = function() {
            const el = document.getElementById('quick-batch-errors');
            if (!el) return;
            el.textContent = '';
            el.classList.remove('visible');
        };

        window.showBatchErrors = function(messages, firstLineIndex) {
            const el = document.getElementById('quick-batch-errors');
            const ta = document.getElementById('quick-textarea');
            if (el) {
                el.textContent = messages.join('\n');
                el.classList.add('visible');
            }
            if (ta && firstLineIndex != null && firstLineIndex >= 0) {
                const lines = ta.value.split('\n');
                let start = 0;
                for (let i = 0; i < firstLineIndex && i < lines.length; i++) {
                    start += lines[i].length + 1;
                }
                const end = start + (lines[firstLineIndex] || '').length;
                setTimeout(() => {
                    ta.focus();
                    try { ta.setSelectionRange(start, end); } catch (e) { /* ignore */ }
                }, 0);
            }
        };

        window.parseQuickBatchLines = function(text, formYear, formMonth) {
            const lines = text.split('\n');
            const parsed = [];
            const errors = [];
            let firstErrorLine = null;

            lines.forEach((line, index) => {
                if (!line.trim()) return;
                const lineNo = index + 1;

                if (!line.includes(',')) {
                    errors.push(`Line ${lineNo}: use DATE, TIME, TASK, PLACE (comma required)`);
                    if (firstErrorLine === null) firstErrorLine = index;
                    return;
                }

                const parts = line.split(',');
                const dateTok = (parts[0] || '').trim();
                const timeTok = parts.length > 1 ? (parts[1] || '').trim() : '';
                const desc = parts.length > 2 ? (parts[2] || '').trim() : '';
                const place = parts.length > 3 ? parts.slice(3).join(',').trim() : '';

                const dateRes = window.parseBatchDateToken(dateTok, formYear, formMonth);
                if (dateRes.error) {
                    errors.push(`Line ${lineNo}: ${dateRes.error}`);
                    if (firstErrorLine === null) firstErrorLine = index;
                    return;
                }

                const timeRes = window.parseBatchTimeField(timeTok);
                if (timeRes.error) {
                    errors.push(`Line ${lineNo}: ${timeRes.error}`);
                    if (firstErrorLine === null) firstErrorLine = index;
                    return;
                }

                if (!timeRes.time && !desc && !place) {
                    errors.push(`Line ${lineNo}: missing time, task, or place`);
                    if (firstErrorLine === null) firstErrorLine = index;
                    return;
                }

                parsed.push({
                    lineIndex: index,
                    year: dateRes.year,
                    month: dateRes.month,
                    date: dateRes.day,
                    time: timeRes.time,
                    task: desc,
                    place: place
                });
            });

            return { parsed, errors, firstErrorLine };
        };

        window.saveTaskToLocal = function() {
            const selectedYearInput = parseInt(document.getElementById('task-year').value) || currentViewYear;
            const formMonth = parseInt(document.getElementById('month-select').value);
            let tasksToSave = [];
            const finalColor = currentOwner === 'yy' ? 'var(--color-purple)' : selectedColor;

            if (isQuickMode) {
                window.clearBatchErrors();
                const batch = window.parseQuickBatchLines(
                    document.getElementById('quick-textarea').value,
                    selectedYearInput,
                    formMonth
                );

                if (batch.errors.length > 0) {
                    window.showBatchErrors(batch.errors, batch.firstErrorLine);
                    return;
                }
                if (batch.parsed.length === 0) {
                    window.showBatchErrors(['No tasks to add. Use: DATE, TIME, TASK, PLACE'], 0);
                    return;
                }

                let dayMaxOrders = {};
                batch.parsed.forEach((row, index) => {
                    const y = row.year;
                    const m = row.month;
                    const d = row.date;
                    const t = row.time;
                    const desc = row.task;
                    const p = row.place;

                    let dayKey = `${y}-${m}-${d}-${currentOwner}`;
                    if (dayMaxOrders[dayKey] === undefined) {
                        let currentDayTasks = window.tasks.filter(x => (x.year || new Date().getFullYear()) === y && x.month === m && x.date === d && x.owner === currentOwner);
                        dayMaxOrders[dayKey] = currentDayTasks.length > 0 ? Math.max(...currentDayTasks.map(x => x.customOrder || 0)) : 0;
                    }

                    let cOrder;
                    let tNum = t ? window.timeSortNumber(t) : NaN;
                    if (!isNaN(tNum)) { cOrder = (tNum * 10000) + index; }
                    else { cOrder = dayMaxOrders[dayKey] + 10 + index; }
                    dayMaxOrders[dayKey] = cOrder;

                    const cleanDetails = `${t}, ${p}, ${desc}`;
                    tasksToSave.push({
                        id: generateUniqueId(), isEvent: false, owner: currentOwner,
                        year: y, month: m, date: d, time: t, place: p, task: desc,
                        color: finalColor, rawDetails: cleanDetails, customOrder: cOrder, isCancelled: false
                    });
                });

                if (tasksToSave.length > 0) {
                    lastUsedYear = tasksToSave[0].year;
                    lastUsedMonth = tasksToSave[0].month;
                    lastUsedDate = tasksToSave[0].date;
                    lastUsedOwner = currentOwner;
                }
            } else {
                const m = parseInt(document.getElementById('month-select').value);
                const d = parseInt(document.getElementById('day-input').value);
                const t = document.getElementById('task-time').value.trim();
                const desc = document.getElementById('task-desc').value.trim();
                const p = document.getElementById('task-place').value.trim();
                
                if (!d) {
                    document.getElementById('day-input').focus();
                    return;
                }
                if (!t && !p && !desc) return;

                let existingTask = editingId ? window.tasks.find(x => x.id === editingId) : null;
                let cancelStat = existingTask ? (existingTask.isCancelled || false) : false;

                let currentDayTasks = window.tasks.filter(x => (x.year || new Date().getFullYear()) === selectedYearInput && x.month === m && x.date === d && x.owner === currentOwner);
                let lastOrder = currentDayTasks.length > 0 ? Math.max(...currentDayTasks.map(x => x.customOrder || 0)) : 0;
                
                let cOrder;
                if (existingTask && existingTask.time === t) { cOrder = existingTask.customOrder; } 
                else {
                    let tNum = t ? window.timeSortNumber(t) : NaN;
                    if (!isNaN(tNum)) { cOrder = (tNum * 10000); } else { cOrder = lastOrder + 10; }
                }

                lastUsedYear = selectedYearInput; lastUsedMonth = m; lastUsedDate = d; lastUsedOwner = currentOwner;
                window.savePrefs();

                const cleanDetails = `${t}, ${p}, ${desc}`;
                tasksToSave.push({ id: editingId || generateUniqueId(), isEvent: false, owner: currentOwner, year: selectedYearInput, month: m, date: d, time: t, place: p, task: desc, color: finalColor, rawDetails: cleanDetails, customOrder: cOrder, isCancelled: cancelStat });
            }

            const wasEditing = !!editingId;
            let newTasks = [...window.tasks];
            tasksToSave.forEach(taskObj => {
                if(editingId) newTasks = newTasks.filter(t => t.id !== taskObj.id);
                newTasks.push(taskObj);
                window.offlineQueue.push({ action: 'set', id: taskObj.id, data: taskObj });
            });

            // Persist last-used from batch earliest too
            if (isQuickMode && tasksToSave.length > 0) {
                const sample = tasksToSave[0];
                lastUsedYear = sample.year; lastUsedMonth = sample.month; lastUsedDate = sample.date;
                lastUsedOwner = currentOwner;
                window.savePrefs();
            }
            
            window.tasks = newTasks;
            localStorage.setItem('my_tasks', JSON.stringify(window.tasks));
            localStorage.setItem('my_queue', JSON.stringify(window.offlineQueue));
            
            window.updateArchiveYearsDropdown();
            window.renderSchedule();
            window.closeDayAddPopup();
            window.clearBatchErrors();

            // Jump to earliest saved task (batch) / the one task (single)
            if (tasksToSave.length > 0) {
                const earliest = tasksToSave.slice().sort((a, b) => {
                    const ya = a.year || 0, yb = b.year || 0;
                    if (ya !== yb) return ya - yb;
                    if (a.month !== b.month) return a.month - b.month;
                    if (a.date !== b.date) return a.date - b.date;
                    return (a.customOrder || 0) - (b.customOrder || 0);
                })[0];
                window.revealAndFocusTask(earliest);
                window.showToast(wasEditing ? 'Updated' : (tasksToSave.length > 1 ? `Added ${tasksToSave.length}` : 'Added'));
            }
            
            window.updateSyncStatus();
            if (window.triggerCloudSync) window.triggerCloudSync();
        };

        window.setHistoryView = function(showHistory) {
            if (isShowingHistory === showHistory) return;
            isShowingHistory = showHistory;
            document.getElementById('view-title').style.display = 'block';
            document.getElementById('view-title').innerText = isShowingHistory ? "History" : "Upcoming";
            document.getElementById('menu-toggle-history').innerText = isShowingHistory ? "Upcoming" : "History";
        };

        window.revealAndFocusTask = function(task) {
            if (!task) return;
            const today = new Date();
            const todayTime = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
            const taskYear = task.year || today.getFullYear();
            const taskTime = new Date(taskYear, task.month, task.date).getTime();

            if (taskYear !== currentViewYear) {
                currentViewYear = taskYear;
                const selectEl = document.getElementById('view-year-select');
                if (selectEl) selectEl.value = taskYear;
            }

            if (taskYear === today.getFullYear()) {
                window.setHistoryView(taskTime < todayTime);
            } else {
                window.setHistoryView(false);
            }

            window.renderSchedule();
            window.focusTaskInSchedule(task.id);
        };

        window.focusTaskInSchedule = function(taskId) {
            if (!taskId) return;
            setTimeout(() => {
                const safeId = (window.CSS && CSS.escape) ? CSS.escape(taskId) : String(taskId).replace(/"/g, '');
                const taskEl = document.querySelector(`.task-item[data-id="${safeId}"]`);
                if (!taskEl) return;
                // Expand history month accordion if needed
                const monthContent = taskEl.closest('.month-content');
                if (monthContent && monthContent.style.display === 'none') {
                    monthContent.style.display = 'block';
                }
                const y = taskEl.getBoundingClientRect().top + window.scrollY - 80;
                window.scrollTo({ top: y, behavior: 'smooth' });
                const origBg = taskEl.style.backgroundColor;
                taskEl.style.backgroundColor = 'rgba(255, 255, 255, 0.25)';
                setTimeout(() => { taskEl.style.backgroundColor = origBg; }, 1200);
            }, 60);
        };

        // --- SEARCH ---
        let searchDebounceTimer = null;

        window.openSearchPopup = function() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('search-popup').style.display = 'block';
            document.getElementById('modal-backdrop').style.display = 'block';
            const input = document.getElementById('search-query');

        window.runSearch = function(query) {
            const q = (query || '').trim().toLowerCase();
            const resultsEl = document.getElementById('search-results');
            if (!q) {
                resultsEl.innerHTML = '<div class="search-empty">Type to search tasks and notes</div>';
                return;
            }

            const hits = [];

            window.tasks.forEach(task => {
                const hay = [
                    task.task || '',
                    task.place || '',
                    task.time || '',
                    window.formatTimeDisplay(task.time || ''),
                    task.owner === 'yy' ? 'yy' : 'mine',
                    String(task.year || ''),
                    String((task.month || 0) + 1),
                    String(task.date || '')
                ].join(' ').toLowerCase();
                if (hay.includes(q)) {
                    hits.push({ kind: 'task', task, sortKey: `${task.year || 0}-${String(task.month).padStart(2,'0')}-${String(task.date).padStart(2,'0')}-${task.customOrder || 0}` });
                }
            });

            window.events.forEach(ev => {
                const hay = [
                    ev.name || '',
                    String(ev.year || ''),
                    String((ev.startMonth || 0) + 1),
                    String(ev.startDate || '')
                ].join(' ').toLowerCase();
                if (hay.includes(q)) {
                    hits.push({ kind: 'event', event: ev, sortKey: `${ev.year || 0}-${String(ev.startMonth).padStart(2,'0')}-${String(ev.startDate).padStart(2,'0')}` });
                }
            });

            hits.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

            if (hits.length === 0) {
                resultsEl.innerHTML = '<div class="search-empty">No matches</div>';
                return;
            }

            resultsEl.innerHTML = '';
            hits.slice(0, 80).forEach(hit => {
                const div = document.createElement('div');
                div.className = 'search-result-item';
                if (hit.kind === 'task') {
                    const t = hit.task;
                    const y = t.year || new Date().getFullYear();
                    const dow = daysOfWeek[new Date(y, t.month, t.date).getDay()];
                    const parts = [];
                    if (t.time) parts.push(window.formatTimeDisplay(t.time));
                    if (t.task) parts.push(t.task);
                    if (t.place) parts.push(`@${t.place}`);
                    if (t.isCancelled) div.classList.add('cancelled');
                    div.innerHTML = '';
                    const meta = document.createElement('div');
                    meta.className = 'search-result-meta';
                    meta.textContent = `${y}-${t.month + 1}-${t.date} ${dow} · ${t.owner === 'yy' ? 'YY' : 'Mine'}`;
                    const body = document.createElement('div');
                    body.className = 'search-result-body';
                    body.style.color = t.owner === 'yy' ? 'var(--color-purple)' : (t.color || 'var(--text-main)');
                    body.textContent = parts.join(' ') || '(empty task)';
                    div.appendChild(meta);
                    div.appendChild(body);
                    div.onclick = () => {
                        window.closeSearchPopup();
                        window.revealAndFocusTask(t);
                    };
                } else {
                    const ev = hit.event;
                    const y = ev.year || new Date().getFullYear();
                    const meta = document.createElement('div');
                    meta.className = 'search-result-meta';
                    const endPart = (ev.endMonth != null && ev.endDate != null)
                        ? ` → ${ev.endDate}/${ev.endMonth + 1}`
                        : '';
                    meta.textContent = `${y}-${ev.startMonth + 1}-${ev.startDate}${endPart} · Note/Trip`;
                    const body = document.createElement('div');
                    body.className = 'search-result-body';
                    body.style.color = ev.color || 'var(--color-orange)';
                    body.textContent = ev.name || '(note)';
                    div.appendChild(meta);
                    div.appendChild(body);
                    div.onclick = () => {
                        window.closeSearchPopup();
                        const ey = ev.year || new Date().getFullYear();
                        if (ey !== currentViewYear) {
                            currentViewYear = ey;
                            const selectEl = document.getElementById('view-year-select');
                            if (selectEl) selectEl.value = ey;
                        }
                        window.renderSchedule();
                        window.openEventPopup(ev.startMonth, ev.startDate, ev.id);
                    };
                }
                resultsEl.appendChild(div);
            });
        };

        window.moveEditingTaskLocal = function(direction) {
            if (!editingId) return;
            const task = window.tasks.find(t => t.id === editingId);
            if (!task) return;
            
            let group = window.tasks.filter(t => (t.year || new Date().getFullYear()) === (task.year || new Date().getFullYear()) && t.month === task.month && t.date === task.date && t.owner === task.owner);
            group.sort((a, b) => a.customOrder - b.customOrder);
            
            let currentIndex = group.findIndex(t => t.id === editingId);
            let targetIndex = currentIndex + direction;
            
            if (targetIndex >= 0 && targetIndex < group.length) {
                let targetTask = group[targetIndex];
                let tempOrder = task.customOrder;
                task.customOrder = targetTask.customOrder;
                targetTask.customOrder = tempOrder;
                
                if (task.customOrder === targetTask.customOrder) { task.customOrder += (direction * 1); }
                
                window.offlineQueue.push({ action: 'set', id: task.id, data: task });
                window.offlineQueue.push({ action: 'set', id: targetTask.id, data: targetTask });
                
                localStorage.setItem('my_tasks', JSON.stringify(window.tasks));
                localStorage.setItem('my_queue', JSON.stringify(window.offlineQueue));
                
                window.renderSchedule();
                window.updateSyncStatus();
                if (window.triggerCloudSync) window.triggerCloudSync();
            }
        };

        window.renderCalendar = function() {
            document.getElementById('cal-month-display').innerText = calMode === 'days' ? `${calRenderMonth + 1}月 ${calRenderYear}` : `${calRenderYear}年`;
            const gridDays = document.getElementById('cal-grid');

                gridDays.style.display = 'grid'; gridMonths.style.display = 'none'; gridDays.innerHTML = '';
                
                const daysInMonth = new Date(calRenderYear, calRenderMonth + 1, 0).getDate();
                // Monday-first: Sun(0)→6, Mon(1)→0, …
                const firstDay = mondayIndex(new Date(calRenderYear, calRenderMonth, 1));
                const today = new Date();

                // Selected day from task form (if set)
                const selYear = parseInt(document.getElementById('task-year').value, 10);
                const selMonth = parseInt(document.getElementById('month-select').value, 10);
                const selDay = parseInt(document.getElementById('day-input').value, 10);
                const hasSelection = Number.isFinite(selYear) && Number.isFinite(selMonth) && Number.isFinite(selDay) && selDay > 0;

                // Headers: 一…日 — weekend labels tinted
                calDaysMonFirst.forEach((d, idx) => {
                    const div = document.createElement('div');
                    div.className = 'cal-day-name' + (idx >= 5 ? ' weekend' : '');
                    div.textContent = d;
                    gridDays.appendChild(div);
                });
                for (let i = 0; i < firstDay; i++) gridDays.appendChild(document.createElement('div'));
                
                for (let i = 1; i <= daysInMonth; i++) {
                    const div = document.createElement('div');
                    const dow = new Date(calRenderYear, calRenderMonth, i).getDay(); // 0=Sun … 6=Sat
                    const isWeekend = dow === 0 || dow === 6;
                    const isCalToday = (calRenderYear === today.getFullYear() && calRenderMonth === today.getMonth() && i === today.getDate());
                    const isSelected = hasSelection && selYear === calRenderYear && selMonth === calRenderMonth && selDay === i;

                    div.className = 'cal-cell'
                        + (isWeekend ? ' weekend' : '')
                        + (isCalToday ? ' today' : '')
                        + (isSelected ? ' selected' : '');
                    div.textContent = i;

                        }

                    gridDays.appendChild(div);
